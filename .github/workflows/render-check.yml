name: Check game rendering
on:
  push:
    paths: ['index.html', 'tests/render.cjs', '.github/workflows/render-check.yml']
  pull_request:
    paths: ['index.html', 'tests/render.cjs', '.github/workflows/render-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: npm install --prefix "$RUNNER_TEMP/jine-check" playwright-core@1.55.0 three@0.170.0
      - name: Check first paint, terrain and graphics recovery
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/dev/null 2>&1 &
          NODE_PATH="$RUNNER_TEMP/jine-check/node_modules" node tests/render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-screenshots
          path: render-check-*.png
          if-no-files-found: ignore
          retention-days: 3
