let seed = 20261119;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const rr = (a, b) => a + (b - a) * rnd();

let seedB = 777;
function rndB(){ seedB |= 0; seedB = seedB + 0x6D2B79F5 | 0; let t = Math.imul(seedB ^ seedB >>> 15, 1 | seedB);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

const gradMap = (() => {

const matCache = new Map();
function M(hex, o = {}){
  const key = hex + '|' + (o.gloss || 0) + '|' + (o.rough || 0) + '|' + (o.side || 0) + '|' + (o.vc || 0);
  if (!o.unique && matCache.has(key)) return matCache.get(key);
  let m;
  const base = { color:hex, side:o.side ? THREE.DoubleSide : THREE.FrontSide, vertexColors:!!o.vc };
  if (ST.mat === 'lambert') m = new THREE.MeshLambertMaterial({ ...base, flatShading:true });
  else if (ST.mat === 'physical') m = new THREE.MeshPhysicalMaterial({ ...base, roughness:o.rough ?? 0.55,
      metalness:0, clearcoat:o.gloss ?? 0, clearcoatRoughness:0.16, envMapIntensity:0.16 });
  else m = new THREE.MeshToonMaterial({ ...base, gradientMap:gradMap });
  if (o.map) m.map = o.map;
  if (!o.unique) matCache.set(key, m);
  return m;
}
// 외곽선 — 뒷면을 화면 픽셀 기준 두께로 부풀린다
const outlineU = { px:{ value:0.004 }, color:{ value:INK ? new THREE.Vector3(0x26 / 255, 0x19 / 255, 0x0f / 255) : new THREE.Vector3(0x1c / 255, 0x2b / 255, 0x12 / 255) },
                   boil:{ value:0 }, vary:{ value:INK ? 0.9 : 0 } };
const outlineMat = new THREE.ShaderMaterial({
  uniforms: outlineU, side: THREE.BackSide,
  vertexShader: `uniform float px; uniform float boil; uniform float vary;
    float h3(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
    float n3(vec3 x){ vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(mix(h3(i), h3(i + vec3(1.0,0.0,0.0)), f.x), mix(h3(i + vec3(0.0,1.0,0.0)), h3(i + vec3(1.0,1.0,0.0)), f.x), f.y),
                 mix(mix(h3(i + vec3(0.0,0.0,1.0)), h3(i + vec3(1.0,0.0,1.0)), f.x), mix(h3(i + vec3(0.0,1.0,1.0)), h3(i + vec3(1.0,1.0,1.0)), f.x), f.y), f.z); }
    void main(){
      vec4 p = vec4(position, 1.0);
      vec3 n = normal;
      #ifdef USE_INSTANCING
        p = instanceMatrix * p; n = mat3(instanceMatrix) * n;
      #endif
      vec4 mv = modelViewMatrix * p;
      vec3 vn = normalize(normalMatrix * n);
      float w = 1.0;
      if (vary > 0.0){ w = 1.0 + vary * (n3(position * 3.1 + vec3(boil * 1.7, boil * 2.9, boil * 2.3)) - 0.5) * 1.5; }
      mv.xyz += vn * px * w * max(1.0, -mv.z);

    }`,
  fragmentShader: `uniform vec3 color; void main(){ gl_FragColor = vec4(color, 1.0); }`,

function outline(mesh, k = 1){
  if (!ST.outline) return mesh;

  o.castShadow = false; o.receiveShadow = false;
  mesh.add(o);

}
const _olCache = {};
function outlineMat2(k){
  if (_olCache[k]) return _olCache[k];
  const m = outlineMat.clone();
  m.uniforms = { px:{ value:0.004 * k }, color:outlineU.color, k:{ value:k }, boil:outlineU.boil, vary:outlineU.vary };
  _olCache[k] = m; return m;
}

const _up = new THREE.Vector3(0, 1, 0), _dv = new THREE.Vector3(), _qq = new THREE.Quaternion();
// 밑동이 원점인 원기둥을 a→b 로 세운다
function limb(mesh, a, b, r){
  _dv.subVectors(b, a);
  const len = Math.max(1e-4, _dv.length());
  mesh.position.copy(a);
  _qq.setFromUnitVectors(_up, _dv.multiplyScalar(1 / len));
  mesh.quaternion.copy(_qq);
  mesh.scale.set(r, len, r);
}

function pathEdge(x){ return 3.6 + Math.sin(x * 0.13) * 0.55 + Math.sin(x * 0.37 + 1.3) * 0.3; }
(() => {
  const gg = new THREE.PlaneGeometry(GX1 - GX0, GZ1 - GZ0, 280, 108);
  gg.rotateX(-Math.PI / 2);
  gg.translate((GX0 + GX1) / 2, 0, (GZ0 + GZ1) / 2);
  const pos = gg.attributes.position, uv = gg.attributes.uv;
  const col = new Float32Array(pos.count * 3);
  const cs = new THREE.Color(PAL.sand), cs2 = new THREE.Color(PAL.sand2);
  const cg = new THREE.Color(PAL.grass), cg2 = new THREE.Color(PAL.grass2);
  const a = new THREE.Color(), b = new THREE.Color();
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), z = pos.getZ(i);
    const d = Math.abs(z - PATH_Z), e = pathEdge(x);
    const t = THREE.MathUtils.smoothstep(d, e - 0.4, e + 1.1);
    const n = 0.5 + 0.5 * Math.sin(x * 0.23 + z * 0.41) * Math.sin(x * 0.061 - z * 0.13);
    a.copy(cs).lerp(cs2, n * 0.7);
    b.copy(cg).lerp(cg2, 0.5 + 0.5 * Math.sin(x * 0.09 + z * 0.17));
    a.lerp(b, t).multiplyScalar(0.95 + 0.05 * Math.sin(x * 1.91 + z * 2.73));
    col[i * 3] = a.r; col[i * 3 + 1] = a.g; col[i * 3 + 2] = a.b;
    if (t > 0.3) pos.setY(i, Math.sin(x * 0.31) * Math.sin(z * 0.43) * 0.22 * t);
    uv.setXY(i, x / 6, z / 6);
  }
  gg.setAttribute('color', new THREE.BufferAttribute(col, 3));
  gg.computeVertexNormals();
  // Keep the broad terrain colors independent of texture and shadow-map sampling.
  const ground = new THREE.Mesh(gg, new THREE.MeshBasicMaterial({ vertexColors:true }));
  world.add(ground);
})();

const _m4 = new THREE.Matrix4(), _p = new THREE.Vector3(), _s = new THREE.Vector3(), _e = new THREE.Euler(), _qa = new THREE.Quaternion();
function instanced(geo, mat, list, castShadow, ol){
  const im = new THREE.InstancedMesh(geo, mat, list.length);
  const c = new THREE.Color();
  list.forEach((it, i) => {
    _e.set(it.rx || 0, it.ry || 0, it.rz || 0);
    _qa.setFromEuler(_e);
    _m4.compose(_p.set(it.x, it.y, it.z), _qa, _s.set(it.sx, it.sy, it.sz));
    im.setMatrixAt(i, _m4);
    im.setColorAt(i, c.set(it.c));
  });
  im.castShadow = castShadow; im.receiveShadow = true;
  if (ol && ST.outline){
    const o = new THREE.InstancedMesh(geo, outlineMat, list.length);
    for (let i = 0; i < list.length; i++){ im.getMatrixAt(i, _m4); o.setMatrixAt(i, _m4); }
    world.add(o);
  }
  world.add(im);
  return im;
}

// 길 앞쪽(카메라 쪽) 풀 · 클로버 — 밟히는 장면을 가까이서 볼 때 그 자리만 잠깐 치운다
const FRONT = { grass:null, list:null, hidden:[], props:[], hiddenProps:[] };
const _zeroM = new THREE.Matrix4().makeScale(0, 0, 0), _fm4 = new THREE.Matrix4();
function clearFront(x0, x1){
  const ox = world.position.x, im = FRONT.grass;
  FRONT.list.forEach((it, i) => {
    if (it.z < 1.2) return;
    const wx = it.x + ox;
    if (wx < x0 || wx > x1) return;
    im.getMatrixAt(i, _fm4); FRONT.hidden.push([i, _fm4.clone()]);
    im.setMatrixAt(i, _zeroM);
  });
  im.instanceMatrix.needsUpdate = true;
  for (const g of FRONT.props){
    const wx = g.position.x + ox;
    if (g.visible && wx >= x0 && wx <= x1){ g.visible = false; FRONT.hiddenProps.push(g); }
  }
}
function restoreFront(){
  for (const [i, m] of FRONT.hidden) FRONT.grass.setMatrixAt(i, m);
  if (FRONT.hidden.length) FRONT.grass.instanceMatrix.needsUpdate = true;
  FRONT.hidden.length = 0;
  for (const g of FRONT.hiddenProps) g.visible = true;
  FRONT.hiddenProps.length = 0;
}
// 풀잎
const bladeGeo = (() => {
  if (ST.mat === 'lambert'){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute([-0.5,0,0, 0.5,0,0, 0.12,1,0.18], 3));
    g.computeVertexNormals(); return g;
  }
  const pts = [], idx = [], N = 5;
  for (let k = 0; k <= N; k++){
    const t = k / N, w = 0.5 * Math.pow(1 - t, 0.75) + 0.02, bend = 0.32 * t * t;
    pts.push(-w, t, bend, w, t, bend);
  }
  for (let k = 0; k < N; k++){ const a = k * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  g.setIndex(idx); g.computeVertexNormals(); return g;
})();
(() => {

function clover(x, z, h, s){
  const g = new THREE.Group();
  const stem = mk(G.cyl, '#4f9a2e', { ol:false }); stem.scale.set(0.06 * s, h, 0.06 * s); g.add(stem);
  for (let k = 0; k < 3; k++){
    const a = k / 3 * Math.PI * 2 + rr(-0.2, 0.2);
    const leaf = mk(G.sph, pick(['#5fb83c','#4fa733','#6cc247']), { rough:0.6 });
    leaf.scale.set(0.62 * s, 0.07 * s, 0.5 * s);
    leaf.position.set(Math.cos(a) * 0.5 * s, h, Math.sin(a) * 0.5 * s);
    leaf.rotation.y = -a; leaf.rotation.z = 0.15;
    g.add(leaf);
    const mark = mk(G.sph, '#c5e8a8', { ol:false, cast:false });
    mark.scale.set(0.28 * s, 0.075 * s, 0.22 * s);
    mark.position.copy(leaf.position).add(new THREE.Vector3(Math.cos(a) * -0.08 * s, 0.012, Math.sin(a) * -0.08 * s));
    mark.rotation.copy(leaf.rotation);
    g.add(mark);
  }
  g.position.set(x, 0, z); g.rotation.y = rnd() * 6;
  world.add(g);
  if (z > 1.2) FRONT.props.push(g);
}

function dandelion(x, z, h){

function foxLeave(dt){

    const go = fox.yaw <= Math.PI / 2 + 0.3;

  }

  // 길 위를 딛는 건 가까운 쪽 앞발(홀수 박)뿐 — 그 발굽 앞코가 꽁무니에 닿을 자리면 그 발로 지네를 노린다
  while (S.phase === 'play' && !S.dead && S.time >= S.nextStomp - 0.45){
    const i = S.stompIdx, nearLeg = i % 2 === 1;
    const L = cow.legs[nearLeg ? 0 : 1];
    const landT = S.nextStomp, ahead = Math.max(0, landT - S.time);
    const impAt = S.impW + S.cowVelW * ahead;           // 발굽 앞코가 떨어질 자리
    let tx = impAt - HOOF_FRONT, threat = false;
    if (nearLeg && S.threatStomp < 0){
      const tailAt = cent.segs[SEG_N - 1].x + S.speed / CM_PER_WORLD_UNIT * ahead;
      if (impAt >= tailAt - KILL_R){ threat = true; S.threatStomp = i; tx = tailAt + 0.45; }   // 꽁무니 쪽 몸통을 덮게
    }
    L.sw = { t0:S.time, t1:landT, x0:L.foot.x, z0:L.foot.z, x1:tx, z1:L.hip[2] + (threat ? 0.3 : 0), death:threat, threat, home:0.45, i };
    S.stompIdx++; S.nextStomp = S.playT0 + stompTime(S.stompIdx);
  }
  // 꼬리
  let tp = new THREE.Vector3(-26.6, 25.4, COW_Z);
  for (let k = 0; k < cow.tail.length; k++){
    const sw = Math.sin(S.time * 2.2 - k * 0.5) * 0.7 * (k / cow.tail.length);
    const np = tp.clone().add(new THREE.Vector3(-0.35 + sw * 0.3, -2.0, sw));
    limb(cow.tail[k], tp, np, 0.55 - k * 0.04);
    tp = np;
  }
  cow.tuft.position.copy(tp).add(new THREE.Vector3(0, -1.2, 0));
  // 되새김질
  cow.jaw.rotation.y = Math.sin(S.time * 6.2) * 0.12;
  cow.jaw.position.y = -3.8 - Math.max(0, Math.sin(S.time * 6.2)) * 0.35;

}

function updateDeath(dt){

    if (!st.snap && L > st.Ls){ st.snap = true; st.st = 0; st.topLen = L * 0.55; st.botLen = L * 0.45; }

// ───────────────────────── 카메라
const _cp = new THREE.Vector3(), _cd = new THREE.Vector3(), _cr = new THREE.Vector3();
const CC = { pos:new THREE.Vector3(), look:new THREE.Vector3(), fov:45 }, LC = { pos:new THREE.Vector3(), look:new THREE.Vector3(), fov:45 };
const _cv = new THREE.Vector3();
function shotCam(n, portrait, out){
  const hx = S.headX;
  if (n === 1){          // 걷기 — 앞 위에서, 몸이 화면 위쪽으로 뻗어 나간다

    out.look.set(hx + 5.6, portrait ? 5.0 : 4.2, -0.5);
  } else if (n === 3){   // 여우 정면 — 엎드린 여우를 지네 어깨 너머로

function updateCamera(dt){
  const portrait = W < H;
  if (S.mode === 'cine'){
    shotCam(S.shot, portrait, CC);
    camera.fov = CC.fov; camera.position.copy(CC.pos); camera.lookAt(CC.look);
    LC.pos.copy(CC.pos); LC.look.copy(CC.look); LC.fov = CC.fov;
  }
  // 소가 바짝 붙으면 카메라가 조금 물러나 뒤쪽(발굽이 떨어지는 자리)까지 보여 준다
  const camKT = S.phase === 'play' && !S.dead ? clamp(1 - S.stompGapCm / 30, 0, 1) : 0;
  S.camK += (camKT - S.camK) * Math.min(1, dt * 2.5);
  const focusX = S.headX - (portrait ? 3.55 + 1.5 * S.camK : 5.6 + 2.2 * S.camK);
  S.camX = S.mode === 'side' && S.phase !== 'title' ? S.camX + (focusX - S.camX) * Math.min(1, dt * 6) : focusX;
  if (S.mode === 'side'){
    const fov = portrait ? 44 : 30;
    camera.fov = fov;
    const tanH = Math.tan(fov / 2 * D2R) * camera.aspect;
    const span = portrait ? (S.phase === 'title' ? 12.6 : 10.2 + 2.2 * S.camK) : 21 + 3 * S.camK;
    const D = span / 2 / tanH;
    const elev = (portrait ? 28 : 24) * D2R;
    _cp.set(S.camX, 0.4, 0.15);
    camera.position.set(_cp.x, _cp.y + D * Math.sin(elev), _cp.z + D * Math.cos(elev));
    const low = portrait ? 0.34 : 0.2;
    const alpha = Math.atan(low * Math.tan(fov / 2 * D2R));
    _cd.subVectors(_cp, camera.position).normalize();
    _cr.crossVectors(_cd, _up).normalize();
    _cd.applyAxisAngle(_cr, alpha);
    _cp.copy(camera.position).add(_cd);
    // 컷신에서 넘어올 땐 마지막 컷에서 게임 시점으로 부드럽게
    const bk = 1;
    if (bk < 1){
      camera.position.lerpVectors(LC.pos, camera.position.clone(), bk);
      _cp.lerpVectors(LC.look, _cp.clone(), bk);
      camera.fov = lerp(LC.fov, fov, bk);
    }
    camera.lookAt(_cp);
  } else if (S.mode === 'wide'){
    camera.fov = portrait ? 76 : 64;
    camera.position.set(S.headX + (portrait ? 4.3 : 7.5), portrait ? 1.0 : 1.4, portrait ? 2.3 : 3.6);
    camera.lookAt(S.headX - 20, portrait ? 10.5 : 7.5, -3.8);
  } else if (S.mode === 'death'){
    const k = sstep(clamp((S.deadT - 0.6) / 3.0, 0, 1));

    camera.fov = portrait ? 56 : 40;
    camera.position.set(S.hitX + lerp(3.6, 6.2, k) + late * 0.5, lerp(1.4, 5.6, k) + late * 0.35, lerp(6.0, 12.5, k) + late);

// ───────────────────────── 게임 진행
function gameUpdate(dt){
  if (S.phase !== 'play' || S.dead) return;
  // 속도 — 맞게 누를 때마다 붙고, 가만두면 줄어든다 (넘어져 있는 동안은 그대로)
  if (S.fallT > 0) S.fallT = Math.max(0, S.fallT - dt);
  else { S.speed -= (S.speed * DRAG + BASE_FRICTION) * dt; if (S.speed < 0) S.speed = 0; }
  if (S.grace > 0) S.grace -= dt;
  S.tangle = Math.max(0, S.tangle - dt / 0.75);
  // 소 — 멀리 갈수록 조금씩 빨라진다
  S.cowVelW = (5.4 + S.dist * 0.004) / CM_PER_WORLD_UNIT;
  S.impW += S.cowVelW * dt;
  // 마디 — 순서는 마디 첫 박에서만 바뀌고, 반 마디 전에 미리 알린다
  const g0 = S.playT0 + 0.3;
  const bar = Math.floor((S.time - g0) / BAR);
  if (bar > S.barSeen){ S.barSeen = bar; if (bar > 0 && bar - S.patBar >= patBars()) newPattern(bar, g0); }
  if (!S.warned && g0 + (S.patBar + patBars()) * BAR - S.time <= WARN_LEAD){ S.warned = true; bubbleEl.classList.add('warn'); sfx('warn'); }
  // 와이드 컷 — 네 마디마다 한 마디 동안 소 쪽을 돌아본다 (음메). 컷이 바뀌는 순간에만 배경을 앞으로 옮긴다
  S.cutT += dt;
  const wideNow = (S.cutT % CUT_EVERY) > (CUT_EVERY - CUT_HOLD);
  if (wideNow !== S.wide){
    S.wide = wideNow; sfx('cut');
    if (wideNow) sfx('moo', Math.max(0.35, 1 / (1 + (S.stompGapCm + 8.4) * 0.035)));
    wrapWorld(180);
  }
  wrapWorld(300);
  S.mode = S.wide ? 'wide' : 'side';
  recWatch();
}
// 배경(풀밭·길)은 560칸 — 지네가 끝에 닿기 전에 200칸씩 앞으로 옮겨 끝없이 이어지게
function wrapWorld(lim){
  if (S.headX - world.position.x > lim) world.position.x += 200;
}
function hoofGapCm(){
  const hoof = cow.legs[0].hoof; // 길 위에 있는 앞발
  const toeX = cow.g.position.x + hoof.position.x + HOOF_FRONT * Math.cos(hoof.rotation.z);
  const tailEdgeX = cent.segs[SEG_N - 1].x - KILL_R;
  return Math.max(0, tailEdgeX - toeX) * CM_PER_WORLD_UNIT;
}
// 추격 속도와 박자에 쓰는 다음 착지 기준점 ~ 꽁무니 거리 (cm)
function updateGap(){
  if (S.phase === 'play' && !S.dead) S.stompGapCm = Math.max(0, (cent.segs[SEG_N - 1].x - S.impW) * CM_PER_WORLD_UNIT);
  S.gapReal = S.headX - cow.x;
}
// 캡처(자동 확인)용 손 — 정한 빠르기로 순서대로 누르고, 가끔 틀리고, 정한 시각부터 손을 놓는다
const BOT = CAPTURE ? { rate:+(Q.get('bot') || 5), miss:+(Q.get('bmiss') || 0), stop:+(Q.get('bstop') || 1e9), fade:+(Q.get('bfade') || 0), rescue:+(Q.get('brescue') || 0) } : null;
function botUpdate(dt){
  const panic = BOT && BOT.rescue && S.stompGapCm < BOT.rescue;   // 소가 바짝 붙으면 다시 미친 듯이 누른다 (달아나기 확인용)
  if (!BOT || S.phase !== 'play' || S.dead || (S.t > BOT.stop && !panic)) return;
  S.botT -= dt;
  if (S.botT > 0) return;
  const rate = panic ? 9 : Math.max(1.2, BOT.rate - BOT.fade * S.t);
  S.botT += (0.85 + 0.3 * rnd()) / rate;
  if (S.fallT > 0) return;
  let g = S.pat[S.idx];
  if (BOT.miss > 0 && S.grace <= 0 && rnd() < BOT.miss) g = (g + 1 + Math.floor(rnd() * 3)) % 4;
  S.padHold[g] = 0.09;
  sfx('keyDown');
  press(g);
}

// ───────────────────────── 밟히는 장면 녹화 — 소가 16cm 안으로 들어오면 돌리기 시작해서 교훈 컷이 끝날 때까지
// 3D 화면 위에 만화 칸 · 내레이션 글자를 얹어 한 화면으로 담고, 소리(음악·효과음)도 같이 담는다
const REC = { r:null, start:0, mime:'', blob:null, url:null, cv:null, cx:null, dest:null, w:0, h:0, game:0, fs:0 };
function pickMime(audio){
  if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
  const c = audio ? ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
                  : ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (const m of c) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
let _recOK = null;
function recSupported(){
  if (_recOK === null) _recOK = !CAPTURE && !!(HTMLCanvasElement.prototype.captureStream && window.MediaRecorder && pickMime(false));
  return _recOK;
}
function recBegin(){
  if (REC.r || !recSupported()) return;
  const sc = Math.min(renderer.getPixelRatio(), 720 / Math.max(1, Math.min(W, H)));    // 화면 해상도대로, 짧은 쪽은 720px 까지
  REC.w = Math.max(2, Math.round(W * sc / 2) * 2); REC.h = Math.max(2, Math.round(H * sc / 2) * 2);
  if (!REC.cv) REC.cv = document.createElement('canvas');
  REC.cv.width = REC.w; REC.cv.height = REC.h; REC.cx = REC.cv.getContext('2d');
  recDraw();
  const make = audio => {
    const mime = pickMime(audio);
    if (!mime) throw new Error('mime');
    const tracks = [...REC.cv.captureStream(30).getVideoTracks()];
    if (audio){
      if (!REC.dest){ REC.dest = actx.createMediaStreamDestination(); master._out.connect(REC.dest); }
      tracks.push(...REC.dest.stream.getAudioTracks());
    }
    const r = new MediaRecorder(new MediaStream(tracks), { mimeType:mime, videoBitsPerSecond:2500000 });
    r._mime = mime;
    return r;
  };
  let r = null;
  try { if (actx) r = make(true); } catch (e) { r = null; }
  if (!r){ try { r = make(false); } catch (e) { return; } }
  const chunks = [], game = REC.game;
  r._keep = false;
  r.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  r.onstop = () => {
    try { r.stream.getVideoTracks().forEach(t => t.stop()); } catch (e) {}
    if (!r._keep || game !== REC.game || !chunks.length) return;
    const blob = new Blob(chunks, { type:r.mimeType || r._mime });
    if (!blob.size) return;
    if (REC.url) URL.revokeObjectURL(REC.url);
    REC.blob = blob; REC.url = URL.createObjectURL(blob); REC.mime = blob.type;
    const ext = blob.type.includes('mp4') ? 'mp4' : 'webm';
    saveBtn.href = clipOpen.href = REC.url;
    saveBtn.download = 'jine-' + Math.floor(S.dist) + 'cm.' + ext;
    clipActions.hidden = false;
  };
  try { r.start(); } catch (e) { return; }
  REC.r = r; REC.start = performance.now();
}
function recEnd(keep){
  const r = REC.r; if (!r) return;
  REC.r = null; r._keep = keep;
  try { r.stop(); } catch (e) {}
}
function recWatch(){
  if (!recSupported()) return;
  if (S.stompGapCm < 16){
    if (!REC.r) recBegin();
    else if (performance.now() - REC.start > 14000){ recEnd(false); recBegin(); }   // 너무 길어지면 새로 시작 — 밟히는 순간이 늘 끝쪽에 남게
  } else if (REC.r) recEnd(false);
}
// 한 장면 그리기 — 3D 를 그린 직후에 불러야 화면이 남아 있다
function recDraw(){
  const c = REC.cx; if (!c) return;
  const w = REC.w, h = REC.h, k = w / W;
  c.drawImage(renderer.domElement, 0, 0, w, h);
  if (elFrame.style.display === 'block'){
    const fm = lerp(-12, 12, S.fkShown || 0) * k;
    if (fm > 0){
      c.fillStyle = '#fdf6e4';
      c.fillRect(0, 0, w, fm); c.fillRect(0, h - fm, w, fm); c.fillRect(0, 0, fm, h); c.fillRect(w - fm, 0, fm, h);
    }
    c.strokeStyle = '#26190f'; c.lineWidth = 3.5 * k;
    c.strokeRect(fm + 1.75 * k, fm + 1.75 * k, w - 2 * fm - 3.5 * k, h - 2 * fm - 3.5 * k);
  }
  for (const el of [elNar1, elNar2]) if (el.style.display === 'block' && el._k) recNar(c, el, k);
}
function recNar(c, el, k){
  const r = el.getBoundingClientRect();
  const x = r.left * k, y = r.top * k, w = r.width * k, h = r.height * k;
  c.fillStyle = '#fffdf6'; c.fillRect(x, y, w, h);
  c.strokeStyle = '#26190f'; c.lineWidth = 3 * k; c.strokeRect(x + 1.5 * k, y + 1.5 * k, w - 3 * k, h - 3 * k);
  if (!REC.fs) REC.fs = parseFloat(getComputedStyle(el).fontSize) || 21;
  const fs = REC.fs * k, lh = fs * 1.38, padX = (3 + 13) * k, padY = (3 + 8) * k;
  c.font = fs + 'px "Poor Story", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  c.fillStyle = '#26190f'; c.textBaseline = 'middle';
  // 줄바꿈은 화면과 같게 — 띄어쓰기에서만 나눈다
  const text = PLAN[el._k].chars.map(ch => ch.ch).join(''), maxW = w - padX * 2 + 1;
  const lines = []; let cur = '', start = 0, pos = 0;
  for (const word of text.split(' ')){
    const t = cur ? cur + ' ' + word : word;
    if (cur && c.measureText(t).width > maxW){ lines.push([start, cur]); start = pos; cur = word; }
    else cur = t;
    pos += word.length + 1;
  }
  lines.push([start, cur]);
  let left = el._n;
  lines.forEach(([st, ln], i) => {
    const show = ln.slice(0, Math.max(0, left - st));
    if (show) c.fillText(show, x + padX, y + padY + lh * (i + 0.5));
  });
}
// ───────────────────────── 결과창 · 다시
const overEl = document.getElementById('over'), panelEl = document.getElementById('panel'), saveBtn = document.getElementById('save');
const clipActions = document.getElementById('clipActions'), clipNote = document.getElementById('clipNote'), clipOpen = document.getElementById('clipOpen');
function showOver(){
  S.overShown = true;
  const d = Math.floor(S.dist);
  document.getElementById('scoreLabel').textContent = S.newBest ? '신기록!' : '이번 기록';
  document.getElementById('score').innerHTML = d + '<span>cm</span>';
  const parts = [];
  if (!S.newBest) parts.push('내 최고 ' + best + 'cm');
  if (S.falls) parts.push('넘어짐 ' + S.falls + '회');
  document.getElementById('sub').textContent = parts.join(' · ');
  panelEl.classList.toggle('newbest', S.newBest);
  overEl.classList.add('on');
  recEnd(true);
}
// 한 판을 처음부터 — 인트로부터 다시 (소리 · 악기는 그대로 둔다)
function resetGame(){
  REC.game++; recEnd(false); REC.blob = null;
  clipActions.hidden = true;
  clipNote.hidden = true;
  clipNote.firstElementChild.textContent = '';
  saveBtn.removeAttribute('href'); clipOpen.removeAttribute('href');
  if (REC.url){ URL.revokeObjectURL(REC.url); REC.url = null; }
  overEl.classList.remove('on'); panelEl.classList.remove('newbest');
  const clock = S.clock;
  Object.assign(S, freshState());
  S.clock = clock;
  Object.assign(MZ, { T:0, k:-1, cell:null, cellIdx:-1, zone:'low', stunT:-1, lastPad:-9, cut:false, rr:0, ped:0, aoff:null });
  MZ.voices.length = 0;
  if (actx) MCUT.delete(actx);
  restoreFront();
  world.position.x = 0;
  // 지네
  for (const sg of cent.segs){ sg.sq = null; sg.g.scale.set(1, 1, 1); }
  for (const L of cent.legs){ L.detached = false; L.dead0 = false; L.sw = null; L.lift = 0; }
  headG.scale.set(1, 1, 1);
  placeCentipede(-8);
  // 소
  cow.g.visible = false; cow.x = -40; cow.bellA = 0; cow.bellV = 0;
  for (const L of cow.legs){ L.sw = null; L.lift = 0; L.foot.set(L.hip[0] + (L.front ? 1 : -1), 0, L.hip[2]); }
  if (stuck.parent) stuck.parent.remove(stuck);
  stuck.visible = false;
  // 여우
  Object.assign(fox, { x:0, z:0, yaw:Math.PI, crouch:0, lean:0, leanNow:0, walkPh:0, walkAmt:0, look:0, roll:0,
                       mouth:0, mouthT:0, mouthHold:0, blink:0, shrug:0, gest:0, ear:0, show:false });
  // 체액 · 먼지
  for (const g of fx.goo){ g.on = false; g.m.visible = false; }
  for (const sp of fx.splats){ sp.on = false; sp.m.visible = false; }
  for (const st of fx.strings){ st.on = false; st.snap = false; st.top.visible = false; st.bot.visible = false; }
  for (const m of fx.pool) m.visible = false;
  for (const dd of fx.dust){ dd.t = 9; dd.life = 1; dd.m.visible = false; }
  for (const o of ooze){ o.r = 0; o.m.visible = false; }
  // 교훈 컷 무대
  STG.on = false; STG.shot = 0; STG.init5 = false; STG.hit = 0;
  for (const kk of STG.inks){ kk.t = 9; kk.sp.visible = false; }
  for (const kk in SPR){ SPR[kk].v = SPR[kk].w = SPR[kk].t = 0; }
  // 화면
  bubbleEl.classList.remove('tangled', 'warn'); bubbleBody.classList.remove('fresh');
  padEls.forEach(el => el.classList.remove('down', 'up', 'want', 'bad'));
  lastCombo = -1; gapNum._cm = null;
  S.pat = makePattern(); renderPattern();
  for (let i = 0; i < 4; i++) tick(1 / 30);
  enterIntro();
}
function begin(){
  if (S.phase !== 'title') return;
  audioOn(); sfx('keyDown');
  setTimeout(() => sfx('keyUp'), 70);
  enterIntro();
}

// ───────────────────────── 시작
// 악기 소리는 시작 화면에서 미리 풀어 둔다 — 시작을 누르자마자 인트로 첫 음부터 토이 피아노로 나오게
let PRE = null;
if (!CAPTURE && MUSIC){ try { PRE = new (window.OfflineAudioContext || window.webkitOfflineAudioContext)(2, 1, 44100); loadMusic(PRE); } catch (e) { PRE = null; } }
const SEQ = CAPTURE ? (Q.get('seq') || 'game') : 'full';
cow.g.visible = false;
placeCentipede(-8);
S.pat = makePattern(); renderPattern();
for (let i = 0; i < 4; i++) tick(1 / 30);
if (CAPTURE){
  if (SEQ === 'play') startPlay(false);
  else if (SEQ === 'game'){ S.phase = 'intro'; S.ct = 0; }
}
S.clock = 0;

// 확인용 손잡이 — 캡처 · ?dev 일 때만 연다 (실제 판에선 콘솔로 조작 못 하게)
if (CAPTURE || Q.has('dev')) window.LOOK = {
  step(dt){ tick(dt); render(); return S.clock; },
  sim(dt){ tick(dt); return S.clock; },
  render(){ render(); return S.clock; },
  IT, ET, audioWav,
  state(){ return { phase:S.phase, ct:S.ct, t:S.t, dead:S.dead, deadT:S.deadT, shot:S.shot, clock:S.clock, idx:S.idx, pat:S.pat.slice(), want:S.pat[S.idx],
                    tangle:S.tangle, fallT:S.fallT, speed:S.speed, dist:S.dist, gapM:S.stompGapCm, combo:S.combo, falls:S.falls, wide:S.wide, mode:S.mode,
                    headX:S.headX, impW:S.impW, cowX:cow.x, worldX:world.position.x, over:S.overShown, threat:S.threatStomp, lunge:S.lunge, hitX:S.hitX,
                    patSeq:S.patSeq, grace:S.grace, warned:S.warned, newBest:S.newBest, zone:MZ.zone, T:MZ.T }; },
  sounds(){ return sndLog.map(e => [Math.round(e.t * 100) / 100, e.name]); },
  soundsFull(){ return sndLog.map(e => [Math.round(e.t * 1000) / 1000, e.name, e.args]); },
  press(g){ return press(g); },
  reset(){ resetGame(); },
  begin(){ begin(); },
  audio(){ return { ctx:actx ? actx.state : null, ready:actx ? musicReady(actx) : false, pre:PRE ? musicReady(PRE) : null, sr:actx ? actx.sampleRate : 0 }; },
  rec(){ return { on:!!REC.r, blob:REC.blob ? REC.blob.size : 0, mime:REC.mime, ok:recSupported(), w:REC.w, h:REC.h, state:REC.r ? REC.r.state : '' }; },
  probeDeath(){
    scene.updateMatrixWorld(true);
    const L = cow.legs[0], bb = new THREE.Box3().setFromObject(L.hoof), sb = new THREE.Box3();
    for (const sg of cent.segs) sb.expandByObject(sg.g);
    return { foot:[L.foot.x, L.lift, L.foot.z], hoofMin:[bb.min.x, bb.min.y, bb.min.z], hoofMax:[bb.max.x, bb.max.y, bb.max.z],
             centMin:[sb.min.x, sb.min.y, sb.min.z], centMax:[sb.max.x, sb.max.y, sb.max.z], hitX:S.hitX, headX:S.headX, deadT:S.deadT,
             segs:cent.segs.map(sg => [+sg.x.toFixed(2), +sg.g.position.y.toFixed(2), +sg.z.toFixed(2)]) };
  },
};
window.LOOK_READY = true;

// ───────────────────────── 누르기 · 버튼
const goBtn = document.getElementById('go');
goBtn.addEventListener('pointerdown', e => { e.preventDefault(); goBtn.classList.add('down'); audioOn(); sfx('keyDown'); buzz(8); });
goBtn.addEventListener('pointerup', () => { goBtn.classList.remove('down'); begin(); });
goBtn.addEventListener('pointerleave', () => goBtn.classList.remove('down'));
goBtn.addEventListener('click', begin);
document.getElementById('again').addEventListener('click', () => { audioOn(); sfx('keyUp'); resetGame(); });
saveBtn.addEventListener('click', () => {
  clipNote.hidden = false;
  clipNote.firstElementChild.textContent = '다운로드 요청됨';
  sfx('keyUp');
});
// 컷신 중엔 아무 데나 눌러도 넘어가지 않는다 — 눌린 건 전해졌다는 표시로 화면만 살짝 흔들린다
document.addEventListener('pointerdown', e => {
  if (S.phase === 'title' || skipBtn.contains(e.target)) return;
  audioOn();
  if (S.phase === 'intro' || (S.dead && !S.overShown)) S.shake = Math.max(S.shake, 0.18);
}, { passive:true });
const padDown = i => { const el = padEls[i]; el.classList.remove('up'); el.classList.add('down'); el._t = performance.now(); };
const padUp = i => {
  const el = padEls[i]; if (!el.classList.contains('down')) return;
  const wait = Math.max(0, 60 - (performance.now() - (el._t || 0)));
  setTimeout(() => { el.classList.remove('down'); void el.offsetWidth; el.classList.add('up'); sfx('keyUp'); }, wait);
};
padEls.forEach((el, i) => {
  el.addEventListener('pointerdown', e => { e.preventDefault(); if (S.phase !== 'play' || S.dead) return; audioOn(); sfx('keyDown'); buzz(8); padDown(i); press(i); });
  const up = () => padUp(i);
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up); el.addEventListener('pointerleave', up);
});
// 키보드 — 1·2·3·4 또는 A·S·D·F (한글 자판이어도), 엔터·스페이스로 시작 · 다시
const KC = { Digit1:0, Digit2:1, Digit3:2, Digit4:3, Numpad1:0, Numpad2:1, Numpad3:2, Numpad4:3, KeyA:0, KeyS:1, KeyD:2, KeyF:3 };
const KM = { '1':0, '2':1, '3':2, '4':3, 'a':0, 's':1, 'd':2, 'f':3, 'ㅁ':0, 'ㄴ':1, 'ㅇ':2, 'ㄹ':3 };
const keyOf = e => KC[e.code] ?? KM[(e.key || '').toLowerCase()];
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
    if (S.phase === 'title'){ e.preventDefault(); begin(); }
    else if (overEl.classList.contains('on')){
      if (clipActions.contains(e.target)){
        if (e.key !== 'Enter'){ e.preventDefault(); e.target.click(); }
      } else { e.preventDefault(); audioOn(); sfx('keyUp'); resetGame(); }
    }
    return;
  }
  const m = keyOf(e);
  if (m !== undefined && S.phase === 'play' && !S.dead){ e.preventDefault(); audioOn(); sfx('keyDown'); padDown(m); press(m); }
});
addEventListener('keyup', e => { const m = keyOf(e); if (m !== undefined) padUp(m); });
// 혐규오락실 — 게임 중엔 새 탭으로 열어 하던 판이 날아가지 않게
const face = document.getElementById('arcadeFace');
setInterval(() => {
  const playing = S.phase === 'play' && !S.dead;
  const tg = playing ? '_blank' : '_top';
  if (face.target !== tg){ face.target = tg; if (playing) face.rel = 'noopener'; else face.removeAttribute('rel'); }
}, 250);

if (!CAPTURE){
  const NORENDER = Q.has('norender');   // 소리 확인용 — 화면을 그리지 않고 시계만 돌린다
  let last = performance.now();
  const loop = now => {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    tick(dt);
    if (!NORENDER){ render(); if (REC.r) recDraw(); }
  };
  requestAnimationFrame(loop);
}
</script>
